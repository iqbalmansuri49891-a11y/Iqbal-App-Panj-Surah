<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iqbal App - Panj Surah & Duas</title>

<meta name="theme-color" content="#14532d">
<meta name="description" content="Iqbal App - Panj Surah, Quran, Duas, Darood Sharif and Digital Tasbeeh">

<style>
:root {
    --bg: #f5f7ef;
    --card: #ffffff;
    --text: #202820;
    --muted: #647067;
    --primary: #14532d;
    --accent: #22804a;
    --border: #e1e8dd;
    --soft: #edf7ee;
    --nav: #ffffff;
    --shadow: 0 4px 18px rgba(20, 83, 45, .08);
}

body.dark-mode {
    --bg: #101712;
    --card: #1b251e;
    --text: #edf5ee;
    --muted: #b2c1b5;
    --primary: #267546;
    --accent: #57bd7b;
    --border: #344439;
    --soft: #243a2b;
    --nav: #18221b;
    --shadow: 0 4px 18px rgba(0,0,0,.2);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding-bottom: 85px;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s, color .25s;
}

button, select {
    font: inherit;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--primary);
    color: white;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

header h1 {
    font-size: 20px;
    margin: 0;
}

header p {
    font-size: 12px;
    margin: 6px 0 0;
    opacity: .9;
}

.container {
    max-width: 700px;
    margin: 18px auto;
    padding: 0 13px;
}

.tab-content {
    display: none;
    animation: fadeIn .2s ease;
}

.tab-content.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-title {
    font-size: 21px;
    margin: 12px 3px 17px;
    color: var(--primary);
}

body.dark-mode .page-title {
    color: var(--accent);
}

.hero {
    background: linear-gradient(135deg, #14532d, #2f8550);
    color: white;
    border-radius: 17px;
    padding: 22px 17px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
}

.hero h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.hero p {
    margin: 0;
    line-height: 1.7;
    font-size: 14px;
}

.card {
    background: var(--card);
    padding: 17px;
    margin-bottom: 15px;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow-wrap: anywhere;
}

.card h3 {
    color: var(--accent);
    font-size: 18px;
    line-height: 1.5;
    margin: 0 0 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
}

.arabic {
    font-family: "Noto Naskh Arabic", "Amiri", serif;
    font-size: 27px;
    line-height: 2.1;
    text-align: right;
    direction: rtl;
    margin: 15px 0;
    overflow-wrap: anywhere;
}

.translation {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.9;
    margin: 10px 0;
}

audio {
    width: 100%;
    height: 40px;
    margin-top: 10px;
}

.btn {
    display: inline-block;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    padding: 11px 14px;
    margin-top: 8px;
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
}

.btn:active {
    transform: scale(.98);
}

.btn-secondary {
    background: var(--soft);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-danger {
    background: #c62828;
}

.btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 2px calc(8px + env(safe-area-inset-bottom));
    background: var(--nav);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 15px rgba(0,0,0,.06);
}

.nav-item {
    flex: 1;
    min-width: 0;
    color: var(--muted);
    text-align: center;
    text-decoration: none;
    font-size: 10px;
    cursor: pointer;
    padding: 5px 0;
}

.nav-item.active {
    color: var(--accent);
    font-weight: bold;
}

.nav-item .icon {
    display: block;
    font-size: 21px;
    margin-bottom: 4px;
}

.tasbeeh-box {
    text-align: center;
    padding: 20px 10px;
}

.counter-circle {
    width: 175px;
    height: 175px;
    margin: 25px auto;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #14532d, #2f8550);
    color: white;
    box-shadow: 0 8px 25px rgba(20,83,45,.3);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    border: 7px solid rgba(255,255,255,.18);
}

.counter-circle h1 {
    font-size: 49px;
    margin: 0;
}

.counter-circle span {
    font-size: 12px;
    margin-top: 5px;
}

.counter-circle:active {
    transform: scale(.96);
}

.count-label {
    font-size: 17px;
    font-weight: bold;
    color: var(--accent);
}

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

.setting-row:last-child {
    border-bottom: none;
}

.setting-row select {
    max-width: 55%;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px;
}

.setting-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
}

.name-item {
    background: var(--soft);
    padding: 11px;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 8px;
}

.empty-state {
    text-align: center;
    padding: 30px 12px;
    color: var(--muted);
    line-height: 1.8;
}

input[type="search"] {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
    margin-bottom: 14px;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

footer {
    text-align: center;
    padding: 15px;
    color: var(--muted);
    font-size: 12px;
}

@media (min-width: 650px) {
    .container {
        padding: 0 20px;
    }

    .arabic {
        font-size: 31px;
    }
}

@media (max-width: 380px) {
    header h1 {
        font-size: 17px;
    }

    .nav-item {
        font-size: 9px;
    }

    .nav-item .icon {
        font-size: 19px;
    }

    .card {
        padding: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h1 id="app-title">📖 Iqbal App - Panj Surah</h1>
    <p id="header-subtitle">कुरआन शरीफ • दुआएँ • दरूद शरीफ</p>
</header>

<main class="container">

    <!-- HOME -->
    <section id="home-tab" class="tab-content active">

        <div class="hero">
            <h2>السلام عليكم 🤲</h2>
            <p>Iqbal App में आपका स्वागत है। कुरआन की तिलावत करें, दुआएँ पढ़ें और अल्लाह का ज़िक्र करें।</p>
        </div
